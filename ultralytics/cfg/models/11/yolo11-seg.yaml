# Ultralytics YOLO11-seg instance segmentation model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/segment

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-seg.yaml' will call yolo11-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 203 layers, 2876848 parameters, 2876832 gradients, 10.5 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 203 layers, 10113248 parameters, 10113232 gradients, 35.8 GFLOPs
  m: [0.50, 1.00, 512] # summary: 253 layers, 22420896 parameters, 22420880 gradients, 123.9 GFLOPs
  l: [1.00, 1.00, 512] # summary: 379 layers, 27678368 parameters, 27678352 gradients, 143.0 GFLOPs
  x: [1.00, 1.50, 512] # summary: 379 layers, 62142656 parameters, 62142640 gradients, 320.2 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head
  head:
  # ... (Up-sample path starts)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 (P5 upsampled)
  # Level 1 (P4 fusion): Fuses P5-up (L11), P4-backbone (L6), P3-backbone (L3)
  - [[-1, 6, 3], 1, ASFF, [1, 512]] # 12. Changed 'from' to 3 inputs.
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 (P4 upsampled)
  # Level 2 (P3 fusion): Fuses P4-up (L14), P4-backbone (L6), P3-backbone (L3)
  - [[-1, 6, 3], 1, ASFF, [2, 256]] # 15. Changed 'from' to 3 inputs.
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  # ... (Down-sample path starts)
  - [-1, 1, Conv, [256, 3, 2]] # 17 (P3 downsampled to P4 size)
  # Level 1 (P4 fusion): Fuses P3-down (L17), P4-processed (L13), P5-backbone (L10)
  - [[-1, 13, 10], 1, ASFF, [1, 512]] # 18. Changed 'from' to 3 inputs.
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 20 (P4 downsampled to P5 size)
  # Level 0 (P5 fusion): Fuses P4-down (L20), P4-processed (L13), P5-backbone (L10)
  - [[-1, 13, 10], 1, ASFF, [0, 1024]] # 21. Changed 'from' to 3 inputs.
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)
  
  - [[16, 19, 22], 1, Segment, [nc, 32, 256]] # Detect(P3, P4, P5)
